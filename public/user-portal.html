<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLibrary Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/portal-styles.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" type="image/png">
</head>
<body>
    <div class="portal-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-book-reader brand-icon"></i>
                <h1 class="brand-name">eLibrary</h1>
                <button class="sidebar-collapse-btn" id="desktopSidebarCollapseBtn" aria-label="Toggle Sidebar">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#dashboard" class="nav-link active" data-section="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
                    <li><a href="#books" class="nav-link" data-section="books"><i class="fas fa-book"></i><span>All Books</span></a></li>
                    <li><a href="#categories" class="nav-link" data-section="categories"><i class="fas fa-list-alt"></i><span>Categories</span></a></li>
                    <li><a href="#favorites" class="nav-link" data-section="favorites"><i class="fas fa-heart"></i><span>Favorites</span></a></li>
                    <li><a href="#profile" class="nav-link" data-section="profile"><i class="fas fa-user"></i><span>Profile</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="#" class="nav-link" id="logoutButton" style="color: red;"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <button class="sidebar-toggle-mobile" aria-label="Toggle Sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search books, authors...">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="user-actions">
                    <div class="user-avatar" id="userAvatar">
                        <img src="https://api.dicebear.com/6.x/initials/svg?seed=User" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-area">
                <section id="dashboard" class="content-section active">
                    <h2>Dashboard</h2>
                    <div class="dashboard-grid">
                        <!-- Stats cards will be dynamically inserted here -->
                    </div>
                    <h3>Featured Books</h3>
                    <div id="featuredBooksGrid" class="book-grid">
                        <!-- Featured books will be dynamically inserted here -->
                    </div>
                </section>

                <section id="books" class="content-section">
                    <h2>All Books</h2>
                    <div class="filters">
                        <select id="categoryFilter">
                            <option value="all">All Categories</option>
                            <!-- Categories will be dynamically inserted here -->
                        </select>
                        <select id="sortFilter">
                            <option value="title_asc">Sort by Title (A-Z)</option>
                            <option value="title_desc">Sort by Title (Z-A)</option>
                            <option value="author_asc">Sort by Author (A-Z)</option>
                            <option value="recent">Most Recent</option>
                        </select>
                    </div>
                    <div id="allBooksGrid" class="book-grid">
                        <!-- All books will be dynamically inserted here -->
                    </div>
                </section>

                <section id="categories" class="content-section">
                    <h2>Book Categories</h2>
                    <div id="categoriesList" class="category-grid">
                        <!-- Categories will be dynamically inserted here -->
                    </div>
                </section>

                <section id="favorites" class="content-section">
                    <h2>My Favorites</h2>
                    <div id="favoriteBooksGrid" class="book-grid">
                        <!-- Favorite books will be dynamically inserted here -->
                    </div>
                </section>

                <section id="profile" class="content-section">
                    <div class="profile-page-card"> 
                        <h2 class="profile-card-title">User Profile</h2>
                        <div class="profile-card-avatar-area">
                            <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=User" alt="User Avatar" id="profileLargeAvatar" class="profile-card-avatar-image">
                            <button id="changeAvatarBtn" class="profile-card-change-avatar-button">
                                <i class="fas fa-camera"></i> <span>Change Avatar</span>
                            </button>
                        </div>
                        <div class="profile-card-text-info">
                            <h3 id="profileUsernameDisplay" class="profile-card-username">Username</h3>
                            <p id="profileEmailDisplay" class="profile-card-email">user@example.com</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    
    <!-- Avatar Selection Modal -->
    <div id="avatarModal" class="avatar-modal">
        <div class="avatar-modal-content">
            <div class="avatar-modal-header">
                <h2>Choose Your Avatar</h2>
                <button id="closeAvatarModalBtn" class="avatar-modal-close">&times;</button>
            </div>
            <div id="avatarSelectionGrid" class="avatar-selection-grid">
                <!-- Avatar options will be populated here by JavaScript -->
            </div>
            <div class="avatar-modal-footer">
                <button id="cancelAvatarChangeBtn" class="btn btn-secondary">Cancel</button>
                <button id="saveAvatarChangeBtn" class="btn btn-primary">Save Avatar</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="/js/portal-main.js"></script>
</body>
</html>
