<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.4" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#orbGrad)" filter="url(#glow2)"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="70" cy="80" r="8" fill="rgba(255,255,255,0.8)"/>
  <circle cx="130" cy="110" r="5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="110" cy="70" r="4" fill="rgba(255,255,255,0.5)"/>
</svg>
