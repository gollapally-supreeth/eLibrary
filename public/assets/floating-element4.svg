<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#14b8a6" flood-opacity="0.3" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#glow4)">
    <rect x="30" y="30" width="140" height="140" rx="20" fill="url(#techGrad)"/>
    <circle cx="100" cy="100" r="35" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="65" y1="70" x2="135" y2="70" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <line x1="65" y1="100" x2="135" y2="100" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <line x1="65" y1="130" x2="115" y2="130" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="50" cy="150" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="150" cy="50" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="150" cy="150" r="8" fill="rgba(255,255,255,0.8)"/>
  </g>
</svg>
