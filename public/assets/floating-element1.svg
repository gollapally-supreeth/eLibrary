<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#6366f1" flood-opacity="0.3" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
  </defs>
  <g filter="url(#glow1)">
    <!-- Abstract digital knowledge symbol -->
    <circle cx="100" cy="100" r="65" fill="url(#grad1)" opacity="0.9"/>
    <circle cx="100" cy="100" r="55" fill="none" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    <path d="M60,100 C60,75 80,60 100,60 C120,60 140,75 140,100 C140,125 120,140 100,140 C80,140 60,125 60,100 Z" 
          fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
    <circle cx="100" cy="100" r="10" fill="white" opacity="0.9"/>
    <circle cx="70" cy="85" r="5" fill="white" opacity="0.7"/>
    <circle cx="130" cy="85" r="5" fill="white" opacity="0.7"/>
    <circle cx="70" cy="115" r="5" fill="white" opacity="0.7"/>
    <circle cx="130" cy="115" r="5" fill="white" opacity="0.7"/>
  </g>
</svg>
