name: Deploy Backend to EC2

on:
  push:
    branches:
      - E-Library-v2.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ec2-51-20-55-19.eu-north-1.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ubuntu@ec2-51-20-55-19.eu-north-1.compute.amazonaws.com << 'EOF'
            cd ~/eLibrary
            git pull origin E-Library-v2.0
            npm install
            pm2 restart elibrary-backend || pm2 start backend/server.js --name elibrary-backend
          EOF
