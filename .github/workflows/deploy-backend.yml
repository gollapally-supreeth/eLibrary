name: Deploy Backend to EC2

on:
  push:
    branches:
      - E-Library-v2.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@51.20.55.19 "
            cd ~/eLibrary &&
            git pull origin E-Library-v2.0 &&
            cd backend &&
            npm install &&
            pm2 restart elibrary-backend
          "
